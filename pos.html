<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>El Sazón del Valle - POS Caja</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Quicksand', sans-serif; background-color: #fdfaf6; }
    h1, h2, h3 { font-family: 'Fredoka', cursive; }
  </style>
</head>
<body class="text-stone-800 h-screen flex flex-col overflow-hidden">
  <!-- ENCABEZADO SUPERIOR -->
  <header class="bg-amber-700 text-white px-6 py-3 flex justify-between items-center shadow-md">
    <div class="flex items-center gap-3"><span class="text-2xl">🥘</span><div><h1 class="text-xl font-bold uppercase tracking-wide text-amber-100">El Sazón del Valle</h1><p class="text-xs text-amber-200">Sistema Punto de Venta (POS - Caja)</p></div></div>
    <div class="flex items-center gap-4 w-1/2 justify-end"><input type="text" id="searchInput" onkeyup="filterProducts()" placeholder="🔍 Buscar platillo..." class="w-2/3 px-4 py-1.5 text-stone-800 rounded-lg text-sm bg-amber-50 focus:outline-none focus:ring-2 focus:ring-amber-400"><a href="index.html" class="bg-amber-800 hover:bg-amber-900 text-xs px-3 py-2 rounded-lg font-bold text-amber-100 transition">📱 Menú Cliente</a></div>
  </header>
  <!-- CONTENEDOR PRINCIPAL DOS COLUMNAS -->
  <div class="flex-1 flex overflow-hidden">
    <!-- COLUMNA IZQUIERDA: PRODUCTOS -->
    <main class="w-7/12 lg:w-8/12 p-4 overflow-y-auto grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4" id="productsGrid">
      <button onclick="addToCart('Chilaquiles Sencillos', 55)" class="product-card bg-white p-4 rounded-xl border border-amber-200 shadow-sm hover:border-amber-500 hover:shadow transition text-left flex flex-col justify-between"><div><div class="text-xs font-semibold text-amber-700 uppercase">Chilaquiles</div><div class="font-bold text-stone-800">Sencillos</div></div><div class="text-amber-800 font-bold mt-2">$55.00</div></button>
      <button onclick="addToCart('Chilaquiles c/ Huevo', 60)" class="product-card bg-white p-4 rounded-xl border border-amber-200 shadow-sm hover:border-amber-500 hover:shadow transition text-left flex flex-col justify-between"><div><div class="text-xs font-semibold text-amber-700 uppercase">Chilaquiles</div><div class="font-bold text-stone-800">Con Huevo</div></div><div class="text-amber-800 font-bold mt-2">$60.00</div></button>
      <button onclick="addToCart('Chilaquiles c/ Pollo', 65)" class="product-card bg-white p-4 rounded-xl border border-amber-200 shadow-sm hover:border-amber-500 hover:shadow transition text-left flex flex-col justify-between"><div><div class="text-xs font-semibold text-amber-700 uppercase">Chilaquiles</div><div class="font-bold text-stone-800">Con Pollo</div></div><div class="text-amber-800 font-bold mt-2">$65.00</div></button>
      <button onclick="addToCart('Chilaquiles c/ Bistec', 75)" class="product-card bg-white p-4 rounded-xl border border-amber-200 shadow-sm hover:border-amber-500 hover:shadow transition text-left flex flex-col justify-between"><div><div class="text-xs font-semibold text-amber-700 uppercase">Chilaquiles</div><div class="font-bold text-stone-800">Con Bistec</div></div><div class="text-amber-800 font-bold mt-2">$75.00</div></button>
      <button onclick="addToCart('Torta Jamón', 30)" class="product-card bg-white p-4 rounded-xl border border-amber-200 shadow-sm hover:border-amber-500 hover:shadow transition text-left flex flex-col justify-between"><div><div class="text-xs font-semibold text-amber-700 uppercase">Tortas</div><div class="font-bold text-stone-800">Jamón / Huevo</div></div><div class="text-amber-800 font-bold mt-2">$30.00</div></button>
      <button onclick="addToCart('Torta Salchicha / Pechuga / Pierna', 40)" class="product-card bg-white p-4 rounded-xl border border-amber-200 shadow-sm hover:border-amber-500 hover:shadow transition text-left flex flex-col justify-between"><div><div class="text-xs font-semibold text-amber-700 uppercase">Tortas</div><div class="font-bold text-stone-800">Salchicha / Pechuga / Pierna</div></div><div class="text-amber-800 font-bold mt-2">$40.00</div></button>
      <button onclick="addToCart('Taco de Bistec / Pechuga', 30)" class="product-card bg-white p-4 rounded-xl border border-amber-200 shadow-sm hover:border-amber-500 hover:shadow transition text-left flex flex-col justify-between"><div><div class="text-xs font-semibold text-amber-700 uppercase">Tacos</div><div class="font-bold text-stone-800">Bistec / Pechuga (c/papas y nopales)</div></div><div class="text-amber-800 font-bold mt-2">$30.00</div></button>
      <button onclick="addToCart('Burrito Bistec c/ Queso', 80)" class="product-card bg-white p-4 rounded-xl border border-amber-200 shadow-sm hover:border-amber-500 hover:shadow transition text-left flex flex-col justify-between"><div><div class="text-xs font-semibold text-amber-700 uppercase">Burritos</div><div class="font-bold text-stone-800">Bistec con Queso</div></div><div class="text-amber-800 font-bold mt-2">$80.00</div></button>
      <button onclick="addToCart('Ensalada Valle', 80)" class="product-card bg-white p-4 rounded-xl border border-emerald-200 shadow-sm hover:border-emerald-500 hover:shadow transition text-left flex flex-col justify-between"><div><div class="text-xs font-semibold text-emerald-700 uppercase">Ensaladas</div><div class="font-bold text-stone-800">Ensalada Valle (c/Pechuga)</div></div><div class="text-emerald-800 font-bold mt-2">$80.00</div></button>
      <button onclick="addToCart('Café de Olla Grande', 20)" class="product-card bg-white p-4 rounded-xl border border-amber-200 shadow-sm hover:border-amber-500 hover:shadow transition text-left flex flex-col justify-between"><div><div class="text-xs font-semibold text-amber-700 uppercase">Bebidas</div><div class="font-bold text-stone-800">Café de Olla Grande</div></div><div class="text-amber-800 font-bold mt-2">$20.00</div></button>
      <button onclick="addToCart('Café de Olla Chico', 15)" class="product-card bg-white p-4 rounded-xl border border-amber-200 shadow-sm hover:border-amber-500 hover:shadow transition text-left flex flex-col justify-between"><div><div class="text-xs font-semibold text-amber-700 uppercase">Bebidas</div><div class="font-bold text-stone-800">Café de Olla Chico</div></div><div class="text-amber-800 font-bold mt-2">$15.00</div></button>
    </main>
    <!-- COLUMNA DERECHA: ORDEN -->
    <aside class="w-5/12 lg:w-4/12 bg-white border-l border-stone-200 flex flex-col justify-between shadow-lg">
      <div class="p-4 border-b border-stone-200 flex justify-between items-center bg-stone-50"><h2 class="text-lg font-bold text-stone-800">Orden Actual</h2><button onclick="clearCart()" class="text-xs text-red-600 hover:underline">Vaciar</button></div>
      <div id="cartItems" class="flex-1 overflow-y-auto p-4 space-y-3"><p class="text-stone-400 text-sm text-center py-8">No hay artículos en la orden.</p></div>
      <div class="p-4 border-t border-stone-200 bg-stone-50 space-y-3"><div class="flex justify-between text-base font-bold text-stone-800"><span>TOTAL:</span><span id="cartTotal" class="text-amber-700">$0.00</span></div><div class="grid grid-cols-2 gap-2 pt-2"><button onclick="checkout('Efectivo')" class="py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl text-sm transition">💵 Efectivo</button><button onclick="checkout('Tarjeta')" class="py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl text-sm transition">💳 Tarjeta</button></div></div>
    </aside>
  </div>
  <script>
    let cart = [];
    function addToCart(name, price) { const existing = cart.find(item => item.name === name); if (existing) { existing.quantity += 1; } else { cart.push({ name, price, quantity: 1 }); } renderCart(); }
    function updateQuantity(name, delta) { const item = cart.find(item => item.name === name); if (item) { item.quantity += delta; if (item.quantity <= 0) { cart = cart.filter(i => i.name !== name); } } renderCart(); }
    function clearCart() { cart = []; renderCart(); }
    function renderCart() { const container = document.getElementById('cartItems'); const totalEl = document.getElementById('cartTotal'); if (cart.length === 0) { container.innerHTML = '<p class="text-stone-400 text-sm text-center py-8">No hay artículos en la orden.</p>'; totalEl.innerText = '$0.00'; return; } let total = 0; container.innerHTML = ''; cart.forEach(item => { const itemTotal = item.price * item.quantity; total += itemTotal; container.innerHTML += `<div class="flex justify-between items-center bg-stone-100 p-2.5 rounded-lg text-sm"><div class="flex-1 pr-2"><div class="font-bold text-stone-800">${item.name}</div><div class="text-xs text-stone-500">$${item.price.toFixed(2)} c/u</div></div><div class="flex items-center gap-2"><button onclick="updateQuantity('${item.name}', -1)" class="w-6 h-6 bg-white border rounded font-bold text-stone-600 hover:bg-stone-200">-</button><span class="font-bold text-xs">${item.quantity}</span><button onclick="updateQuantity('${item.name}', 1)" class="w-6 h-6 bg-white border rounded font-bold text-stone-600 hover:bg-stone-200">+</button><span class="font-bold text-amber-800 ml-2">$${itemTotal.toFixed(2)}</span></div></div>`; }); totalEl.innerText = `$${total.toFixed(2)}`; }
    function checkout(method) { if (cart.length === 0) { alert('Agrega al menos un producto a la orden.'); return; } const total = cart.reduce((acc, item) => acc + (item.price * item.quantity), 0); alert(`Venta cobrada con éxito (${method})\nTotal: $${total.toFixed(2)}`); clearCart(); }
    function filterProducts() { const query = document.getElementById('searchInput').value.toLowerCase(); document.querySelectorAll('.product-card').forEach(card => { const text = card.innerText.toLowerCase(); card.style.display = text.includes(query) ? 'flex' : 'none'; }); }
  </script>
</body>
</html>
